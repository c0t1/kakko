<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>kakko / clock</title>
  <meta name="description" content="リロードするたびに書体が変わる時計。">
  <meta name="theme-color" content="#111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="gf" rel="stylesheet">
  <style>
    :root {
      --bg: #111; --fg: #f4f1ea; --ac: #ff5a36;
      --font: system-ui;
      --size: 18vw;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, sans-serif;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color .8s ease, color .8s ease;
    }
    .stage {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      perspective: 900px;
    }
    .clock-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 2.5vh;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s ease;
    }
    .clock-wrap.loading { opacity: 0; }
    .clock {
      font-family: var(--font), system-ui, sans-serif;
      font-size: var(--size);
      line-height: 1;
      display: flex; align-items: center;
      white-space: nowrap;
      font-variation-settings: var(--fvs, normal);
      transition: font-variation-settings .9s cubic-bezier(.3,.7,.2,1);
    }
    .d {
      display: inline-block;
      text-align: center;
      width: var(--dw, .62em);
      transform-origin: 50% 60%;
    }
    .sep {
      display: inline-block;
      padding: 0 .04em;
      color: var(--ac);
      transition: opacity .25s ease;
    }
    .sep.off { opacity: .15; }
    .sec-group { color: var(--ac); }
    .date {
      font-family: var(--font), system-ui, sans-serif;
      font-size: clamp(14px, 3.2vw, 34px);
      letter-spacing: .08em;
      opacity: .7;
      font-variation-settings: var(--fvs, normal);
    }
    .info {
      position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      letter-spacing: .12em;
      opacity: .55;
      line-height: 1.8;
    }
    .info a { color: inherit; }
    .info .name { font-size: 13px; opacity: 1; }
    .bar {
      position: fixed; left: 0; top: 0; height: 3px;
      background: var(--ac);
      width: 0;
      transition: width .95s linear;
    }

    /* ---- 1秒ごとの動き ---- */
    .a-drop   { animation: drop .55s cubic-bezier(.3,1.6,.5,1); }
    .a-flip   { animation: flip .6s cubic-bezier(.3,1.4,.5,1); }
    .a-pop    { animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
    .a-spin   { animation: spin .7s cubic-bezier(.5,0,.2,1); }
    .a-blur   { animation: blur .5s ease-out; }
    .a-rise   { animation: rise .5s cubic-bezier(.2,1.4,.4,1); }
    .a-squash { animation: squash .5s cubic-bezier(.3,1.6,.5,1); }
    .a-glitch { animation: glitch .35s steps(2); }
    @keyframes drop   { from { transform: translateY(-.45em); opacity: 0; } }
    @keyframes flip   { from { transform: rotateX(-100deg); opacity: 0; } }
    @keyframes pop    { from { transform: scale(.2); } }
    @keyframes spin   { from { transform: rotate(-200deg) scale(.4); opacity: 0; } }
    @keyframes blur   { from { filter: blur(.12em); opacity: 0; transform: scale(1.3); } }
    @keyframes rise   { from { transform: translateY(.4em); opacity: 0; } }
    @keyframes squash { 0% { transform: scale(1.4,.5); } 100% { transform: none; } }
    @keyframes glitch {
      0%   { transform: translate(.06em,-.03em); text-shadow: -.05em 0 #0ff, .05em 0 #f0f; }
      50%  { transform: translate(-.05em,.04em); text-shadow: .05em 0 #0ff, -.05em 0 #f0f; }
      100% { transform: none; text-shadow: none; }
    }
    .tick-wobble { animation: wobble .6s cubic-bezier(.3,1.6,.5,1); }
    @keyframes wobble { 0% { transform: rotate(var(--wob, 2deg)); } 100% { transform: none; } }

    @media (orientation: portrait) {
      :root { --size: 22vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      .d, .clock-wrap { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="stage">
    <div class="clock-wrap loading" id="wrap">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
    </div>
  </div>
  <div class="info">
    <div class="name"><a id="fontlink" target="_blank" rel="noopener"></a></div>
    <div>tap / space で書体チェンジ</div>
  </div>

  <script>
  // [family, css2 の指定, 可変軸アニメ(任意)]
  // 可変軸: {axis: [min, max]} → 秒に合わせて動く
  const FONTS = [
    ['Bungee', 'Bungee'],
    ['Bungee Shade', 'Bungee+Shade'],
    ['Bungee Spice', 'Bungee+Spice'],
    ['Nabla', 'Nabla:EDPT,EHLT@0..200,0..24', { EDPT: [0, 200], EHLT: [0, 24] }],
    ['Honk', 'Honk:MORF,SHLN@0..45,0..100', { MORF: [0, 45] }],
    ['Kablammo', 'Kablammo:MORF@0..60', { MORF: [0, 60] }],
    ['Climate Crisis', 'Climate+Crisis:YEAR@1979..2050', { YEAR: [1979, 2050] }],
    ['Tilt Prism', 'Tilt+Prism:XROT,YROT@-45..45,-45..45', { XROT: [-45, 45], YROT: [45, -45] }],
    ['Tilt Warp', 'Tilt+Warp:XROT,YROT@-45..45,-45..45', { YROT: [-45, 45] }],
    ['Recursive', 'Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1', { wght: [300, 1000], CASL: [0, 1] }],
    ['Roboto Flex', 'Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000', { wght: [100, 1000], wdth: [25, 151] }],
    ['Fraunces', 'Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1', { wght: [100, 900], SOFT: [0, 100] }],
    ['Big Shoulders Display', 'Big+Shoulders+Display:wght@100..900', { wght: [100, 900] }],
    ['Sixtyfour', 'Sixtyfour:BLED,SCAN@0..100,-53..100', { SCAN: [-53, 100] }],
    ['Workbench', 'Workbench:BLED,SCAN@0..100,-53..100', { BLED: [0, 100] }],
    ['Monoton', 'Monoton'],
    ['Rubik Glitch', 'Rubik+Glitch'],
    ['Rubik Moonrocks', 'Rubik+Moonrocks'],
    ['Rubik Mono One', 'Rubik+Mono+One'],
    ['Press Start 2P', 'Press+Start+2P'],
    ['VT323', 'VT323'],
    ['Silkscreen', 'Silkscreen'],
    ['Orbitron', 'Orbitron:wght@400..900', { wght: [400, 900] }],
    ['Major Mono Display', 'Major+Mono+Display'],
    ['Space Mono', 'Space+Mono:wght@700'],
    ['Playfair Display', 'Playfair+Display:ital,wght@1,900'],
    ['Abril Fatface', 'Abril+Fatface'],
    ['Bodoni Moda', 'Bodoni+Moda:ital,opsz,wght@1,6..96,400..900', { wght: [400, 900] }],
    ['Instrument Serif', 'Instrument+Serif:ital@1'],
    ['DM Serif Display', 'DM+Serif+Display'],
    ['Cinzel Decorative', 'Cinzel+Decorative:wght@900'],
    ['Alfa Slab One', 'Alfa+Slab+One'],
    ['Bebas Neue', 'Bebas+Neue'],
    ['Anton', 'Anton'],
    ['Righteous', 'Righteous'],
    ['Shrikhand', 'Shrikhand'],
    ['Lobster', 'Lobster'],
    ['Pacifico', 'Pacifico'],
    ['Permanent Marker', 'Permanent+Marker'],
    ['Rock Salt', 'Rock+Salt'],
    ['Caveat', 'Caveat:wght@400..700', { wght: [400, 700] }],
    ['Bangers', 'Bangers'],
    ['Creepster', 'Creepster'],
    ['Pirata One', 'Pirata+One'],
    ['UnifrakturMaguntia', 'UnifrakturMaguntia'],
    ['Megrim', 'Megrim'],
    ['Codystar', 'Codystar'],
    ['Ewert', 'Ewert'],
    ['Fascinate', 'Fascinate'],
    ['Syne', 'Syne:wght@400..800', { wght: [400, 800] }],
    ['Comfortaa', 'Comfortaa:wght@300..700', { wght: [300, 700] }],
    ['Fredoka', 'Fredoka:wdth,wght@75..125,300..700', { wght: [300, 700], wdth: [75, 125] }],
    ['Dela Gothic One', 'Dela+Gothic+One'],
    ['Rampart One', 'Rampart+One'],
    ['Train One', 'Train+One'],
    ['Reggae One', 'Reggae+One'],
    ['RocknRoll One', 'RocknRoll+One'],
    ['DotGothic16', 'DotGothic16'],
    ['Stick', 'Stick'],
    ['Hachi Maru Pop', 'Hachi+Maru+Pop'],
    ['Yusei Magic', 'Yusei+Magic'],
    ['Kaisei Decol', 'Kaisei+Decol:wght@700'],
    ['Zen Antique', 'Zen+Antique'],
    ['Mochiy Pop One', 'Mochiy+Pop+One'],
  ];

  // [背景, 文字, アクセント]
  const PALETTES = [
    ['#111111', '#f4f1ea', '#ff5a36'],
    ['#f4f1ea', '#111111', '#ff3b30'],
    ['#0b1d51', '#ffe3d8', '#ffb800'],
    ['#ffd400', '#1a1a1a', '#e4002b'],
    ['#1e3d2f', '#e9f5db', '#ff8fab'],
    ['#ff6f91', '#2b2d42', '#ffffff'],
    ['#000000', '#39ff14', '#39ff14'],
    ['#e8e0d0', '#3a2e2a', '#c1440e'],
    ['#2d00f7', '#f8f9fa', '#f20089'],
    ['#00a6a6', '#fffbe6', '#1d3557'],
    ['#fafafa', '#0047ab', '#ff7a00'],
    ['#240046', '#e0aaff', '#ff9e00'],
    ['#ff4800', '#fff1e6', '#1b1b1b'],
    ['#d8f3dc', '#081c15', '#e63946'],
  ];

  const ANIMS = ['a-drop', 'a-flip', 'a-pop', 'a-spin', 'a-blur', 'a-rise', 'a-squash', 'a-glitch'];
  const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  // 時計・日付・書体名に使う文字だけ読む（軽い）
  const SUBSET = '0123456789:./ ' + DOW.join('') + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const clockEl = $('clock'), dateEl = $('date'), wrap = $('wrap');
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  let current = null, anim = 'a-drop', digitEls = [], sepEls = [], last = '', loadToken = 0;

  function buildClock() {
    clockEl.innerHTML = '';
    digitEls = []; sepEls = [];
    const groups = [[0, 1], [2, 3], [4, 5]];
    groups.forEach((g, gi) => {
      const grp = document.createElement('span');
      grp.className = gi === 2 ? 'sec-group' : '';
      g.forEach(() => {
        const s = document.createElement('span');
        s.className = 'd';
        grp.appendChild(s);
        digitEls.push(s);
      });
      clockEl.appendChild(grp);
      if (gi < 2) {
        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = ':';
        clockEl.appendChild(sep);
        sepEls.push(sep);
      }
    });
    last = '';
  }

  // 数字の最大幅を測って桁がガタつかないようにする
  function measureDigits(family) {
    const c = document.createElement('canvas').getContext('2d');
    c.font = `100px "${family}"`;
    let max = 0;
    for (let i = 0; i < 10; i++) max = Math.max(max, c.measureText(String(i)).width);
    const em = max / 100;
    root.style.setProperty('--dw', (em > 0.2 && em < 2 ? em * 1.04 : 0.62) + 'em');
  }

  async function setFont(font) {
    const token = ++loadToken;
    wrap.classList.add('loading');
    const [family, spec] = font;
    $('gf').href = `https://fonts.googleapis.com/css2?family=${spec}&display=block&text=${encodeURIComponent(SUBSET)}`;
    try {
      await Promise.race([
        document.fonts.load(`100px "${family}"`, '0123456789'),
        new Promise((r) => setTimeout(r, 4000)),
      ]);
    } catch (e) {}
    if (token !== loadToken) return;

    current = font;
    anim = pick(ANIMS);
    const [bg, fg, ac] = pick(PALETTES);
    root.style.setProperty('--bg', bg);
    root.style.setProperty('--fg', fg);
    root.style.setProperty('--ac', ac);
    root.style.setProperty('--font', `"${family}"`);
    document.querySelector('meta[name=theme-color]').content = bg;

    measureDigits(family);
    fit();

    const link = $('fontlink');
    link.textContent = family;
    link.href = 'https://fonts.google.com/specimen/' + family.replace(/ /g, '+');
    link.style.fontFamily = `"${family}", system-ui`;
    history.replaceState(null, '', '#' + encodeURIComponent(family));

    buildClock();
    tick(true);
    wrap.classList.remove('loading');
  }

  // 文字幅が広い書体は少し小さめに、画面に収める
  function fit() {
    const dw = parseFloat(getComputedStyle(root).getPropertyValue('--dw')) || 0.62;
    const portrait = innerHeight > innerWidth;
    const base = portrait ? 92 : 88; // 画面幅の何%に収めるか
    const size = Math.min(base / (6 * dw + 0.9), portrait ? 40 : 26);
    root.style.setProperty('--size', size + 'vw');
  }

  function axisSettings(sec, ms) {
    const axes = current && current[2];
    if (!axes) return 'normal';
    // 0→59秒で行って帰る（30秒で最大）
    const t = (sec + ms / 1000) / 60;
    const k = 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
    return Object.entries(axes)
      .map(([ax, [a, b]]) => `"${ax}" ${(a + (b - a) * k).toFixed(1)}`)
      .join(', ');
  }

  function tick(force) {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    const str = hh + mm + ss;

    digitEls.forEach((el, i) => {
      if (force || str[i] !== last[i]) {
        el.textContent = str[i];
        if (!force) {
          el.classList.remove(anim);
          void el.offsetWidth; // アニメ再始動
          el.classList.add(anim);
        }
      }
    });
    last = str;

    // コロンの点滅
    const on = now.getSeconds() % 2 === 0;
    sepEls.forEach((s) => s.classList.toggle('off', !on));

    // 時計全体がちょっと揺れる
    if (!force) {
      clockEl.style.setProperty('--wob', (Math.random() * 6 - 3).toFixed(2) + 'deg');
      clockEl.classList.remove('tick-wobble');
      void clockEl.offsetWidth;
      clockEl.classList.add('tick-wobble');
    }

    // 可変フォントの軸を秒に合わせて動かす
    root.style.setProperty('--fvs', axisSettings(now.getSeconds(), now.getMilliseconds()));

    dateEl.textContent = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${DOW[now.getDay()]}`;

    // 上の秒バー
    const bar = $('bar');
    const pct = (now.getSeconds() / 59) * 100;
    if (now.getSeconds() === 0) { bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth; bar.style.transition = ''; }
    else bar.style.width = pct + '%';
  }

  function scheduleTick() {
    const delay = 1000 - (Date.now() % 1000) + 5;
    setTimeout(() => { if (current) tick(false); scheduleTick(); }, delay);
  }

  function nextFont() {
    let f;
    do { f = pick(FONTS); } while (FONTS.length > 1 && f === current);
    setFont(f);
  }

  // ポインタの方向にちょっと傾く
  addEventListener('pointermove', (e) => {
    const x = e.clientX / innerWidth - 0.5, y = e.clientY / innerHeight - 0.5;
    wrap.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg)`;
  });
  addEventListener('click', (e) => { if (!e.target.closest('a')) nextFont(); });
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') { e.preventDefault(); nextFont(); }
  });
  addEventListener('resize', fit);

  // #書体名 があればそれで開く（共有用）
  const fromHash = decodeURIComponent(location.hash.slice(1));
  setFont(FONTS.find((f) => f[0] === fromHash) || pick(FONTS));
  scheduleTick();
  </script>
</body>
</html>
